<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}

td.sel{outline:3px solid var(--ac);outline-offset:-3px;background:var(--sr)}

td.fl{animation:p .5s}@keyframes p{from{transform:scale(1.25);background:var(--sr)}}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;padding:8px;border:2px solid var(--bd);border-radius:10px}

.row .d{flex:1;min-width:180px}
.ref{font:700 1.3rem ui-monospace,Consolas,monospace;display:flex;align-items:center;gap:2px}
.chip{width:34px;height:34px;border-radius:8px;border:2px dashed var(--mu);background:var(--card);color:var(--tx);font:700 1rem ui-monospace,monospace;cursor:pointer}
.chip.on{border:2px solid var(--ac);background:var(--acbg);color:var(--ac)}
.cp{font-size:.8rem;color:var(--mu);width:100%}
.btn{margin-top:10px;padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0b1a12}
.btn:disabled{opacity:.5}
.fb{margin-top:12px;padding:12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--acbg);border-left:4px solid var(--ac)}.fb.er{background:var(--erbg);border-left:4px solid var(--er)}.fb p{margin:3px 0}
.big{font-size:2rem;font-weight:700;color:var(--ac)}
.sl{flex:1;min-width:130px;padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}td{white-space:nowrap}.row .d{min-width:150px}th.hd{background:var(--ac);color:#fff}.cr{background:#f4b6b0;color:#5a1410}.cy{background:#fff0a0;color:#4d4100}.cg{background:#bfe8c9;color:#0f4a25}.opt{font-family:inherit}input.sl{flex:0 1 140px;min-width:100px}label{margin-right:14px;cursor:pointer}td.c{cursor:default}.mis{outline:3px dashed var(--er);outline-offset:-3px}</style>
</head>

 rows.forEach(function(r,k){h+="<tr><th>"+(o.nums?o.nums[k]:k+2)+"</th>"+r.map(function(x,c){return'<td class="c '+(o.cls?o.cls(k,c,r):"")+'">'+esc(x)+"</td>"}).join("")+"</tr>"});return h+"</table></div>"}

{k:"cf",title:"Умовне форматування: таблиця продажу",q:"Налаштуйте умовне форматування стовпця «Кількість» за такими правилами: значення менші за 10 — фон червоного відтінку; значення від 11 до 40 — фон жовтого; значення більші за 40 — фон зеленого. Для кожного правила оберіть умову, введіть число (для умови «між» — два числа) та колір заливки. Таблиця змінюватиметься одразу.",

 else if(t.k=="cf"){var co=shuf(["червона","жовта","зелена"]).map(function(x){return"<option>"+x+"</option>"}).join(""),ops='<option value="">— умова —</option><option value="lt">менше за</option><option value="gt">більше за</option><option value="bt">між</option>';

 else{h+='<div id="gr"></div>';var ch=shuf(t.ch.slice());t.rows.forEach(function(r,k){h+='<div class="row" id="tr'+k+'"><div class="d">'+r[0]+'</div><select id="s'+k+'" class="sl" onchange="paint()"><option value="">— оберіть —</option>'+ch.map(function(x){return"<option>"+x+"</option>"}).join("")+"</select></div>"})}

  document.getElementById("gr").innerHTML=tb(t.head,res,{cls:function(k){return bad[k]?"bad":""}});
  return bad.some(Boolean)?er("<p>Рядки, що стоять не на своєму місці, виділено червоним.</p><p>"+t.hint+"</p>"):ok(tries==1,"<p>"+t.good+"</p>")}
 var f=[[gv("o0"),gv("v0")],[gv("o1"),gv("v1")]],and=document.querySelector("input[name=m]:checked").value=="and",vis=[],nums=[],good=true;
 t.rows.forEach(function(r,k){var a=ft(r[t.col],f[0][0],f[0][1]),b=ft(r[t.col],f[1][0],f[1][1]),p=and?a&&b:a||b;if(p){vis.push(r);nums.push(k+2)}if(p!=t.pred(r))good=false});
 document.getElementById("gr").innerHTML=tb(t.head,vis,{nums:nums,af:1,fl:t.col,cls:function(k,c,r){return t.pred(r)?"":"bad"}});
 return good?ok(tries==1,"<p>"+t.good+"</p>"):er("<p>Відображено рядків: "+vis.length+", а має бути: "+t.rows.filter(t.pred).length+". Зайві рядки виділено червоним.</p><p>"+t.hint+"</p>")
}

 dots();var p=pts/T.length,m=p==1?"Відмінно! Ви впевнено впорядковуєте, фільтруєте й форматуєте дані.":p>=.6?"Добре! Повторіть теми з помилками.":"Варто повторити сортування, фільтрацію та умовне форматування.";
 var h='<div class="card"><h2>Результат</h2><div class="big">'+pts+" / "+T.length+"</div><p>"+m+"</p><ul>";

 app.innerHTML=h+'</ul><p class="hint">Пам’ятайте: фільтр не видаляє рядки, а лише приховує їх.</p><button class="btn" onclick="i=0;pts=0;done=[];render()">Пройти ще раз</button></div>'}
